<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IEM Admission Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<style>
:root{--navy:#0b2a6b;--blue:#1d4fd8;--bd:#dbe2f0;--bg:#f5f7fc;--mu:#5b6478;--ok:#18813f}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;color:#1b2030;background:var(--bg)}
button{font:inherit;cursor:pointer}h1,h2,h3{color:var(--navy);margin:0}
.hdr{background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.logo{height:54px;width:auto;flex:none}
.brand{flex:1;min-width:200px}.brand b{display:block;font-size:20px;color:var(--navy);letter-spacing:.3px}.brand span{color:var(--mu);font-size:13px}
.nav{display:flex;gap:18px;align-items:center}.nav a{color:#1b2030;cursor:pointer;position:relative}
.badge{background:#d62839;color:#fff;border-radius:99px;font-size:10px;padding:0 5px;position:absolute;top:-8px;right:-12px}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 140px)}
.side{background:#fff;border-right:1px solid var(--bd);padding:14px 10px}
.side a{display:block;padding:10px 12px;border-radius:8px;cursor:pointer;color:#222}.side a.on{background:#e6edfd;color:var(--navy);font-weight:600}
.help{margin-top:18px;border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:12px;color:var(--mu)}.help h4{margin:0 0 4px;color:var(--navy);font-size:15px}
.main{padding:22px;min-width:0}.sub{color:var(--mu);margin:4px 0 16px}
.ftr{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:block;font-size:12px;color:#333;margin-bottom:3px}.rq{color:#d62839}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:6px;font:inherit;background:#fff}
input.bad,select.bad{border-color:#d62839;background:#fff6f6}.okt{color:var(--ok);font-size:11px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:10px 18px}.btn.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.red{background:#fff;color:#c0392b;border:0}.btn:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.steps{display:flex;justify-content:space-between;margin:6px 0 20px;position:relative}.steps:before{content:"";position:absolute;top:17px;left:8%;right:8%;height:2px;background:var(--bd)}
.st{text-align:center;flex:1;position:relative;font-size:12px;color:var(--mu)}.st i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#eef1f8;border:1px solid var(--bd);margin:0 auto 4px;font-style:normal}
.st.on i{background:var(--navy);color:#fff}.st.on{color:var(--navy);font-weight:600}.st.done i{background:var(--ok);color:#fff}
.alert{border-radius:8px;padding:10px 14px;margin:12px 0}.al-i{background:#e8f0fe;border:1px solid #c9d9fb}.al-e{background:#fdecec;border:1px solid #f5c2c2;color:#a11}.al-o{background:#e9f7ee;border:1px solid #bfe3cb}.al-w{background:#fff6e0;border:1px solid #f1deaa}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}th{background:#f1f4fb;font-size:12px}.tw{overflow-x:auto}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;background:#eef1f8;white-space:nowrap}.tag.Success,.tag.Admitted,.tag.Uploaded{background:#d9f2e2;color:#0d6a30}.tag.Pending,.tag.Waitlisted,.tag.Draft{background:#fdecd0;color:#8a5200}.tag.Rejected{background:#f8d7d7;color:#9b1c1c}.tag.Submitted{background:#dbe7ff;color:#1c3f94}
.auth{max-width:1000px;margin:30px auto;display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.auth .l{background:linear-gradient(#e3eeff,#f4f8ff);padding:40px 24px;text-align:center;color:var(--navy);display:flex;flex-direction:column;justify-content:center}.auth .l img{width:min(300px,85%);height:auto;margin:0 auto 14px}
.auth .r{padding:30px}.auth .r h2{text-align:center}.auth .r .sub{text-align:center}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.pc{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.pc .im{height:110px;display:grid;place-items:center;font-size:44px;color:#fff}.pc .bd{padding:14px}.pc ul{list-style:none;padding:0;margin:10px 0;font-size:13px}.pc li{margin:4px 0}
.pay{display:grid;grid-template-columns:170px 1fr;border:1px solid var(--bd);border-radius:8px}.pay .m div{padding:12px;border-bottom:1px solid var(--bd);cursor:pointer}.pay .m .on{background:#e6edfd;font-weight:600}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;margin:6px 0}.kv span:nth-child(odd){color:var(--mu)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;z-index:9}
.center{padding:60px;text-align:center}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:6px}.side a{white-space:nowrap}.help{display:none}.auth{grid-template-columns:1fr}.auth .l{display:none}.pay{grid-template-columns:1fr}.nav{display:none}.kv{grid-template-columns:120px 1fr}}
@media print{.hdr,.side,.ftr,.noprint{display:none}.layout{display:block}}
</style></head><body><div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const API = async (p, m = 'GET', b) => {
  const t = localStorage.getItem('tok');
  const r = await fetch('/api' + p, { method: m, headers: { 'Content-Type': 'application/json', ...(t && { Authorization: 'Bearer ' + t }) }, body: b ? JSON.stringify(b) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
};
const money = n => '₹ ' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2 });
const fdate = s => s ? new Date(s.replace(' ', 'T') + (s.includes('Z') ? '' : 'Z')).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
const Logo = () => <img className="logo" src="/logo.png" alt="IEM logo" />;
const Header = ({ user, go, unread, logout }) => (
  <div className="hdr"><Logo /><div className="brand"><b>IEM ADMISSION PORTAL</b><span>Institute of Engineering &amp; Management, Kolkata</span></div>
    {user ? <div className="nav"><a onClick={() => go(user.role === 'admin' ? 'admin' : 'dashboard')}>Home</a>
      {user.role === 'applicant' && <React.Fragment><a onClick={() => go('myapps')}>My Applications</a><a onClick={() => go('notifs')}>Notifications{unread > 0 && <span className="badge">{unread}</span>}</a></React.Fragment>}
      <a onClick={() => go('profile')}>👤 {user.name.split(' ')[0]} ▾</a></div>
      : <div className="nav"><a onClick={() => go('login')}>🏠 Home</a></div>}
  </div>);
const Footer = () => <div className="ftr"><span>© 2026 Institute of Engineering &amp; Management, Kolkata. All rights reserved.</span><span>Privacy Policy | Terms &amp; Conditions | Disclaimer</span></div>;

function Login({ go, onLogin }) {
  const [role, setRole] = useState('applicant'), [email, setEmail] = useState(''), [pw, setPw] = useState(''), [show, setShow] = useState(false), [err, setErr] = useState('');
  const submit = async () => { try { const r = await API('/login', 'POST', { email, password: pw, role }); localStorage.setItem('tok', r.token); onLogin(r.user); } catch (e) { setErr(e.message); } };
  return (<div><Header go={go} /><div className="auth"><div className="l"><img src="/logo.png" alt="Institute of Engineering & Management logo" /><hr style={{ width: '50%' }} /><i>Empowering Minds,<br />Shaping Futures</i></div>
    <div className="r"><h2>IEM Admission Portal - Login</h2><p className="sub">Sign in to continue to your account</p>
      <label>Email / Username</label><input value={email} onChange={e => setEmail(e.target.value)} placeholder="Enter email or username" />
      <label style={{ marginTop: 12 }}>Password</label><div style={{ position: 'relative' }}><input type={show ? 'text' : 'password'} value={pw} onChange={e => setPw(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="Enter your password" /><a style={{ position: 'absolute', right: 10, top: 9, cursor: 'pointer' }} onClick={() => setShow(!show)}>👁</a></div>
      {err && <div className="alert al-e">{err}</div>}
      <button className="btn" style={{ width: '100%', marginTop: 16 }} onClick={submit}>Login as {role === 'admin' ? 'Admin' : 'Applicant'}</button>
      <p style={{ textAlign: 'center', color: '#888' }}>OR</p>
      <button className="btn o" style={{ width: '100%' }} onClick={() => go('register')}>Go to Registration</button>
      <p style={{ textAlign: 'center' }}>Login as: <a style={{ cursor: 'pointer', fontWeight: role === 'applicant' ? 700 : 400, color: 'var(--blue)' }} onClick={() => setRole('applicant')}>Applicant</a> | <a style={{ cursor: 'pointer', fontWeight: role === 'admin' ? 700 : 400, color: 'var(--blue)' }} onClick={() => setRole('admin')}>Admin</a></p>
      {role === 'admin' && <p className="sub">Demo admin: username <b>admin</b> / password <b>admin123</b></p>}
    </div></div><Footer /></div>);
}

function Register({ go }) {
  const [f, setF] = useState({ name: '', email: '', phone: '', password: '', confirm: '' }), [err, setErr] = useState(''), [ok, setOk] = useState(false);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const submit = async () => {
    if (f.password !== f.confirm) return setErr('Passwords do not match');
    try { await API('/register', 'POST', f); setOk(true); setErr(''); } catch (e) { setErr(e.message); }
  };
  return (<div><Header go={go} /><div className="auth"><div className="l"><img src="/logo.png" alt="Institute of Engineering & Management logo" /><hr style={{ width: '50%' }} /><i>Empowering Minds,<br />Shaping Futures</i></div>
    <div className="r"><h2>IEM Admission Portal - Register</h2><p className="sub">Create a new applicant account</p>
      {[['name', 'Full Name', 'text'], ['email', 'Email Address', 'email'], ['phone', 'Phone Number', 'tel'], ['password', 'Password', 'password'], ['confirm', 'Confirm Password', 'password']].map(([k, l, t]) =>
        <div key={k} style={{ marginBottom: 10 }}><label>{l}</label><input type={t} value={f[k]} onChange={set(k)} placeholder={'Enter your ' + l.toLowerCase()} /></div>)}
      {err && <div className="alert al-e">{err}</div>}{ok && <div className="alert al-o">Registered! You can now login.</div>}
      <button className="btn" style={{ width: '100%' }} onClick={submit}>Register</button>
      <p style={{ textAlign: 'center', color: '#888' }}>OR</p><button className="btn o" style={{ width: '100%' }} onClick={() => go('login')}>← Back to Login</button>
    </div></div><Footer /></div>);
}

const Steps = ({ n }) => (<div className="steps">{['Application Form', 'Upload Documents', 'Payment', 'Review & Submit'].map((l, i) =>
  <div key={l} className={'st ' + (i + 1 < n ? 'done' : i + 1 === n ? 'on' : '')}><i>{i + 1 < n ? '✓' : i + 1}</i>{l}</div>)}</div>);

function Programs({ go, start }) {
  const [ps, setPs] = useState([]); useEffect(() => { API('/programs').then(setPs); }, []);
  const col = { CSE: '#1d4fd8', ECE: '#6d3fc0', ME: '#1d7a46' }, ic = { CSE: '💻', ECE: '🔌', ME: '⚙️' };
  return (<div><h1>Available Programs / Courses</h1><p className="sub">Explore our undergraduate B.Tech programs and choose the right path for your future.</p>
    <div className="alert al-i">ⓘ All programs are Full-Time (4 Years) | Affiliated to MAKAUT (Formerly WBUT)</div>
    <div className="pcards">{ps.map(p => <div className="pc" key={p.code}><div className="im" style={{ background: col[p.code] }}>{ic[p.code]}</div><div className="bd">
      <h3>{p.name}</h3><p style={{ color: 'var(--mu)', fontSize: 13 }}>{p.description}</p>
      <ul><li>🕑 <b>Duration:</b> {p.duration}</li><li>🎓 <b>Intake:</b> {p.intake} Seats</li><li>📄 <b>Eligibility:</b> {p.eligibility}</li></ul>
      <button className="btn" style={{ background: col[p.code], width: '100%' }} onClick={() => start(p.code)}>Apply Now</button></div></div>)}</div>
    <div className="alert al-w">★ <b>Note:</b> Program details, seat intake, eligibility criteria and other information are indicative and subject to change as per IEM and MAKAUT regulations.</div></div>);
}

const OPT = { gender: ['Male', 'Female', 'Other'], nationality: ['Indian', 'Other'], category: ['General', 'OBC-A', 'OBC-B', 'SC', 'ST', 'EWS'], religion: ['Hindu', 'Muslim', 'Christian', 'Sikh', 'Buddhist', 'Jain', 'Other'],
  blood_group: ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'], state: ['West Bengal', 'Bihar', 'Odisha', 'Jharkhand', 'Assam', 'Delhi', 'Other'], country: ['India', 'Other'],
  relation: ['Father', 'Mother', 'Guardian'], income: ['Below 1 Lakh', '1 - 5 Lakh', '5 - 10 Lakh', 'Above 10 Lakh'], board: ['WBBSE', 'WBCHSE', 'CBSE', 'ICSE', 'ISC', 'Other'],
  year: ['2020', '2021', '2022', '2023', '2024', '2025', '2026'], domicile: ['West Bengal', 'Other State'] };
const REQUIRED = ['full_name', 'dob', 'gender', 'nationality', 'category', 'mobile', 'email', 'address1', 'city', 'state', 'pin', 'country', 'guardian_name', 'relation', 'guardian_mobile',
  'board10', 'school10', 'year10', 'marks10', 'roll10', 'board12', 'school12', 'year12', 'marks12', 'roll12', 'program_code', 'domicile'];

function Form({ go, appId, user, setAppId, preset }) {
  const [f, setF] = useState({ full_name: user.name, mobile: user.phone || '', email: user.email, country: 'India', nationality: 'Indian', program_code: preset || '' });
  const [id, setId] = useState(appId), [progs, setProgs] = useState([]), [showErr, setShowErr] = useState(false), [msg, setMsg] = useState('');
  useEffect(() => { API('/programs').then(p => { setProgs(p); setF(x => ({ ...x, program_code: x.program_code || p[0].code })); });
    if (appId) API('/applications/' + appId).then(a => { const o = {}; Object.keys(a).forEach(k => { if (a[k] != null && typeof a[k] !== 'object') o[k] = a[k]; }); setF(x => ({ ...x, ...o })); }); }, []);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const bad = k => showErr && REQUIRED.includes(k) && !String(f[k] ?? '').trim();
  const mobOK = v => /^\d{10}$/.test(v || ''), mailOK = v => /\S+@\S+\.\S+/.test(v || '');
  const Fld = (k, label, opts, type = 'text', extra) => (<div><label>{label}{REQUIRED.includes(k) && <span className="rq"> *</span>}</label>
    {opts ? <select className={bad(k) ? 'bad' : ''} value={f[k] || ''} onChange={set(k)}><option value="">-- Select --</option>{opts.map(o => Array.isArray(o) ? <option key={o[0]} value={o[0]}>{o[1]}</option> : <option key={o}>{o}</option>)}</select>
      : <input className={bad(k) ? 'bad' : ''} type={type} value={f[k] || ''} onChange={set(k)} />}{extra}</div>);
  const save = async next => {
    if (next) { setShowErr(true); const miss = REQUIRED.filter(k => !String(f[k] ?? '').trim());
      const probs = []; if (!mobOK(f.mobile)) probs.push('mobile number'); if (!mailOK(f.email)) probs.push('email'); if (!/^\d{6}$/.test(f.pin || '')) probs.push('PIN code');
      if (!mobOK(f.guardian_mobile)) probs.push('guardian mobile'); if (+f.marks10 > 100 || +f.marks12 > 100 || +f.marks10 < 0 || +f.marks12 < 0) probs.push('marks (0-100)');
      if (miss.length || probs.length) { setMsg(miss.length ? 'This field is required' : 'Please correct: ' + probs.join(', ')); return; } }
    setMsg('');
    try { const a = id ? await API('/applications/' + id, 'PUT', f) : await API('/applications', 'POST', f); setId(a.id); setAppId(a.id);
      if (next) go('docs', a.id); else setMsg('✓ Draft saved'); } catch (e) { setMsg(e.message); }
  };
  const acad = (s, l, r) => (<tr><td>{l}{r && <span className="rq"> *</span>}</td>
    <td><select className={bad('board' + s) ? 'bad' : ''} value={f['board' + s] || ''} onChange={set('board' + s)}><option value="">--</option>{OPT.board.map(o => <option key={o}>{o}</option>)}</select></td>
    <td><input className={bad('school' + s) ? 'bad' : ''} value={f['school' + s] || ''} onChange={set('school' + s)} /></td>
    <td><select className={bad('year' + s) ? 'bad' : ''} value={f['year' + s] || ''} onChange={set('year' + s)}><option value="">--</option>{OPT.year.map(o => <option key={o}>{o}</option>)}</select></td>
    <td><input type="number" className={bad('marks' + s) ? 'bad' : ''} value={f['marks' + s] ?? ''} onChange={set('marks' + s)} /></td>
    <td><input className={bad('roll' + s) ? 'bad' : ''} value={f['roll' + s] || ''} onChange={set('roll' + s)} /></td></tr>);
  return (<div><h1>Admission Application Form</h1><p className="sub">Enter your details carefully. Fields marked with <span className="rq">*</span> are mandatory.</p><Steps n={1} />
    <div className="card"><h3>1. Personal Details</h3><div className="grid g3" style={{ marginTop: 10 }}>
      {Fld('full_name', 'Full Name')}{Fld('dob', 'Date of Birth', null, 'date')}{Fld('gender', 'Gender', OPT.gender)}{Fld('aadhaar', 'Aadhaar / ID Number')}{Fld('nationality', 'Nationality', OPT.nationality)}{Fld('category', 'Category', OPT.category)}{Fld('religion', 'Religion', OPT.religion)}{Fld('blood_group', 'Blood Group', OPT.blood_group)}</div></div>
    <div className="card"><h3>2. Contact Details</h3><div className="grid g2" style={{ marginTop: 10 }}>
      {Fld('mobile', 'Mobile Number', null, 'tel', mobOK(f.mobile) && <div className="okt">✓ Valid mobile number</div>)}{Fld('email', 'Email Address', null, 'email', mailOK(f.email) && <div className="okt">✓ Valid email address</div>)}
      {Fld('alt_mobile', 'Alternate Mobile Number')}{Fld('address1', 'Address Line 1')}{Fld('address2', 'Address Line 2')}{Fld('city', 'City')}{Fld('state', 'State', OPT.state)}{Fld('pin', 'PIN Code')}{Fld('country', 'Country', OPT.country)}</div></div>
    <div className="card"><h3>3. Guardian Details</h3><div className="grid g2" style={{ marginTop: 10 }}>
      {Fld('guardian_name', "Father's / Guardian's Name")}{Fld('relation', 'Relationship with Applicant', OPT.relation)}{Fld('guardian_mobile', 'Guardian Mobile Number', null, 'tel', mobOK(f.guardian_mobile) && <div className="okt">✓ Valid mobile number</div>)}{Fld('guardian_email', 'Guardian Email', null, 'email')}{Fld('occupation', 'Occupation')}{Fld('income', 'Annual Family Income', OPT.income)}</div></div>
    <div className="card"><h3>4. Academic Details</h3><div className="tw"><table style={{ marginTop: 10, minWidth: 650 }}><thead><tr><th>Examination</th><th>Board / University</th><th>Institution Name</th><th>Passing Year</th><th>Marks / Percentage</th><th>Roll / Reg. No.</th></tr></thead>
      <tbody>{acad('10', '10th / Secondary', true)}{acad('12', '12th / Higher Secondary', true)}</tbody></table></div>
      <h3 style={{ marginTop: 18 }}>Additional Application Details</h3><div className="grid g2" style={{ marginTop: 10 }}>
        {Fld('program_code', 'Preferred Program / Course', progs.map(p => [p.code, p.name]))}{Fld('entrance_rank', 'Entrance Exam / Rank (e.g. JEE Main - 15234)')}{Fld('entrance_roll', 'Entrance Exam Roll Number')}{Fld('domicile', 'Domicile State', OPT.domicile)}</div></div>
    <div className="alert al-i">ⓘ Please ensure all information is correct before proceeding. You can save your application as a draft and continue later.</div>
    {msg && <div className={'alert ' + (msg[0] === '✓' ? 'al-o' : 'al-e')}>{msg[0] === '✓' ? '' : '⛔ '}{msg}</div>}
    <div className="row"><div><button className="btn o" onClick={() => save(false)}>Save Draft</button> <button className="btn o" onClick={() => go('programs')}>← Back</button></div><button className="btn" onClick={() => save(true)}>Next →</button></div></div>);
}

const DOCS = [['tenth', '10th Mark Sheet / Certificate', true, 'Clear and readable copy; all pages if multiple'], ['twelfth', '12th Mark Sheet / Certificate', true, 'Clear and readable copy; all pages if multiple'],
  ['photo_id', 'Photo ID Proof (Aadhaar / Voter ID / PAN)', true, 'Valid ID proof; front side only'], ['photograph', 'Photograph', true, 'Passport size, recent, white background'],
  ['other', 'Other Documents (if any)', false, 'Any other supporting documents'], ['migration', 'Migration Certificate (if applicable)', false, 'Applicable for other Board/University'], ['gap', 'Gap Certificate (if any)', false, 'Required if gap is more than 1 year']];
function Docs({ go, appId }) {
  const [a, setA] = useState(null), [err, setErr] = useState('');
  useEffect(() => { API('/applications/' + appId).then(setA); }, []);
  if (!a) return <div className="center">Loading…</div>;
  const up = (type, file) => {
    if (!file) return; setErr('');
    if (!['application/pdf', 'image/jpeg', 'image/png'].includes(file.type)) return setErr('Only PDF, JPG, JPEG, PNG files are accepted');
    if (file.size > 2 * 1024 * 1024) return setErr('Maximum file size is 2 MB per file');
    const rd = new FileReader(); rd.onload = async () => { try { setA(await API('/applications/' + appId + '/documents', 'POST', { doc_type: type, filename: file.name, mime: file.type, data: rd.result.split(',')[1] })); } catch (e) { setErr(e.message); } }; rd.readAsDataURL(file);
  };
  const rm = async t => setA(await API('/applications/' + appId + '/documents/' + t, 'DELETE'));
  const have = Object.fromEntries(a.documents.map(d => [d.doc_type, d]));
  const next = () => DOCS.filter(d => d[2] && !have[d[0]]).length ? setErr('Please upload all mandatory documents (marked *)') : go('payment', appId);
  return (<div><h1>Upload Documents</h1><p className="sub">Upload clear and valid documents. Mandatory documents are marked *.</p><Steps n={2} />
    <div className="alert al-i">ⓘ Accepted file types: PDF, JPG, JPEG, PNG &nbsp;|&nbsp; Maximum file size: 2 MB per file</div>
    <div className="card tw"><h3>Required Documents</h3><table style={{ marginTop: 8, minWidth: 650 }}><thead><tr><th>Document Type</th><th>Instructions</th><th>File</th><th>Status</th><th>Action</th></tr></thead><tbody>
      {DOCS.map(([k, l, r, ins]) => { const d = have[k]; return (<tr key={k}><td><b>{l}</b>{r && <span className="rq"> *</span>}</td><td style={{ color: 'var(--mu)', fontSize: 12 }}>{ins}</td>
        <td>{d ? <span>📄 {d.filename}<br /><small>{(d.size / 1024).toFixed(0)} KB</small></span> : <small>No file chosen</small>}</td>
        <td><span className={'tag ' + (d ? 'Uploaded' : 'Pending')}>{d ? 'Uploaded' : 'Pending'}</span></td>
        <td><label className="btn sm" style={{ display: 'inline-block', margin: 0, color: '#fff' }}>{d ? 'Replace' : 'Upload'}<input type="file" hidden accept=".pdf,.jpg,.jpeg,.png" onChange={e => { up(k, e.target.files[0]); e.target.value = ''; }} /></label>
          {d && <button className="btn red sm" onClick={() => rm(k)}>Remove</button>}</td></tr>); })}</tbody></table></div>
    {err && <div className="alert al-e">⛔ {err}</div>}
    <div className="row"><button className="btn o" onClick={() => go('form', appId)}>← Back</button><button className="btn" onClick={next}>Next →</button></div></div>);
}

function Qr() { let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280; const c = [];
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) { const f = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16); if (!f && r() > .5) c.push(<rect key={x + '-' + y} x={x} y={y} width="1" height="1" />); }
  const fd = (x, y) => <g key={x + 'f' + y}><rect x={x} y={y} width="7" height="7" /><rect x={x + 1} y={y + 1} width="5" height="5" fill="#fff" /><rect x={x + 2} y={y + 2} width="3" height="3" /></g>;
  return <svg viewBox="-1 -1 27 27" width="150" height="150" fill="#111"><rect x="-1" y="-1" width="27" height="27" fill="#fff" />{c}{fd(0, 0)}{fd(18, 0)}{fd(0, 18)}</svg>; }
function Payment({ go, appId }) {
  const [a, setA] = useState(null), [meth, setMeth] = useState('UPI'), [ok, setOk] = useState(false), [err, setErr] = useState(''), [busy, setBusy] = useState(false);
  useEffect(() => { API('/applications/' + appId).then(setA); }, []);
  if (!a) return <div className="center">Loading…</div>;
  const total = a.fees.application + a.fees.tuition + a.fees.other;
  const pay = async () => { if (!ok) return setErr('Please accept the terms & conditions'); setBusy(true); try { await API('/applications/' + appId + '/pay', 'POST', { method: meth }); go('confirm', appId); } catch (e) { setErr(e.message); setBusy(false); } };
  return (<div><h1>Payment</h1><p className="sub">Please review your application details and fee summary. Select a payment method and proceed to pay.</p><Steps n={3} />
    <div className="grid g2"><div className="card"><h3>Application Summary</h3><div className="kv"><span>Application No.</span><span>{a.app_no}</span><span>Applicant Name</span><span>{a.full_name}</span><span>Program Applied</span><span>B.Tech in {a.program_code}</span><span>Application Date</span><span>{fdate(a.created_at)}</span></div></div>
      <div className="card"><h3>Fee Summary</h3><table style={{ marginTop: 8 }}><tbody><tr><td>Application Fee</td><td align="right">{a.fees.application.toLocaleString('en-IN')}.00</td></tr><tr><td>Tuition Fee (1st Year)</td><td align="right">{a.fees.tuition.toLocaleString('en-IN')}.00</td></tr><tr><td>Other Charges</td><td align="right">{a.fees.other.toLocaleString('en-IN')}.00</td></tr><tr><td><b>Total Amount</b></td><td align="right"><b>{money(total)}</b></td></tr></tbody></table></div></div>
    <div className="card"><h3>Select Payment Method</h3><div className="pay" style={{ marginTop: 10 }}><div className="m">{[['UPI', 'UPI'], ['Card', 'Debit / Credit Card'], ['NetBanking', 'Net Banking'], ['Wallet', 'Wallets']].map(([k, l]) => <div key={k} className={meth === k ? 'on' : ''} onClick={() => setMeth(k)}>{l}</div>)}</div>
      <div style={{ padding: 14 }}>{meth === 'UPI' ? <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'center' }}><Qr /><div><b>Or pay using UPI ID</b><div style={{ display: 'flex', marginTop: 6 }}><input readOnly value="iemadmissions@upi" /><button className="btn o sm" onClick={() => navigator.clipboard?.writeText('iemadmissions@upi')}>Copy</button></div><p style={{ color: 'var(--mu)' }}>Google Pay · PhonePe · Paytm · BHIM · Amazon Pay</p></div></div> : <p>You will be redirected to the {meth} gateway. <i>(Demo: payment is simulated.)</i></p>}</div></div>
      <div className="alert al-i">ⓘ After successful payment, your application is submitted and the payment status is updated. <i>(Prototype: clicking Pay Now simulates a successful payment.)</i></div></div>
    <div className="card"><h3>Terms &amp; Conditions</h3><ul><li>The fees once paid are non-refundable and non-transferable.</li><li>Please ensure that you complete the payment. Incomplete payments may not be recorded.</li><li>On successful payment, you will receive an email and SMS confirmation.</li></ul>
      <label><input type="checkbox" style={{ width: 'auto' }} checked={ok} onChange={e => setOk(e.target.checked)} /> I have read and agree to the above terms &amp; conditions. <span className="rq">*</span></label></div>
    {err && <div className="alert al-e">⛔ {err}</div>}
    <div className="row"><button className="btn o" onClick={() => go('docs', appId)}>✕ Cancel</button><button className="btn" disabled={busy} onClick={pay}>🔒 Pay Now →</button></div></div>);
}

function Confirm({ go, appId }) {
  const [a, setA] = useState(null); useEffect(() => { API('/applications/' + appId).then(setA); }, []);
  if (!a) return <div className="center">Loading…</div>;
  const p = a.payment, dl = () => { const t = `IEM Admission - Application Confirmation\nApplication ID: ${a.app_no}\nName: ${a.full_name}\nProgram: B.Tech ${a.program_code}\nStatus: ${a.status}\nPayment: ${p ? p.txn_id + ' / ' + p.method + ' / Rs.' + p.amount : 'Pending'}\n`;
    const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob([t])); l.download = 'confirmation.txt'; l.click(); };
  return (<div><h1>Application Confirmation</h1><p className="sub">Your application has been submitted successfully. Please find your application details below.</p><Steps n={4} />
    <div className="alert al-o">✅ <b>Congratulations! Your application has been submitted successfully.</b><br />You will receive email and SMS confirmation shortly.</div>
    <div className="card"><h3>Application Summary</h3><div className="kv"><span>Application ID</span><b style={{ color: 'var(--ok)' }}>{a.app_no}</b><span>Applicant Name</span><span>{a.full_name}</span><span>Program Applied For</span><span>B.Tech in {a.program_code}</span><span>Application Date</span><span>{fdate(a.submitted_at)}</span>
      <span>Submission Status</span><span><span className="tag Success">Submitted Successfully</span></span><span>Payment Status</span><span><span className={'tag ' + (a.payment_status)}>Payment {a.payment_status === 'Success' ? 'Successful' : a.payment_status}</span></span></div></div>
    <div className="grid g2"><div className="card"><h3>Application Details</h3><div className="kv"><span>Date of Birth</span><span>{a.dob}</span><span>Gender</span><span>{a.gender}</span><span>Category</span><span>{a.category}</span><span>Nationality</span><span>{a.nationality}</span><span>Mobile Number</span><span>{a.mobile}</span><span>Email Address</span><span>{a.email}</span></div></div>
      <div className="card"><h3>Payment Details</h3>{p && <div className="kv"><span>Transaction ID</span><span>{p.txn_id}</span><span>Payment Date</span><span>{fdate(p.paid_at)}</span><span>Payment Mode</span><span>{p.method}</span><span>Amount Paid</span><span>{money(p.amount)}</span><span>Payment Status</span><span><span className="tag Success">Success</span></span></div>}</div></div>
    <div className="alert al-i">ⓘ Please save or print this confirmation for your records. You can track your application status from “My Applications”.</div>
    <div className="card noprint"><button className="btn o" onClick={dl}>⬇ Download Confirmation</button> <button className="btn o" onClick={() => window.print()}>🖨 Print Confirmation</button> <button className="btn" onClick={() => go('dashboard')}>🏠 Go to Dashboard</button></div>
    <div className="alert al-w">★ <b>Note:</b> Keep your Application ID ({a.app_no}) for future reference. Contact: 033 2666 1234 / admission@iemcal.com</div></div>);
}

function Dashboard({ go, user, start, openApp }) {
  const [apps, setApps] = useState([]); useEffect(() => { API('/applications/mine').then(setApps); }, []);
  const draft = apps.find(a => a.status === 'Draft');
  return (<div><h1>Welcome, {user.name}</h1><p className="sub">Track your admission journey from one place.</p>
    <div className="grid g3"><div className="card"><h3>{apps.length}</h3>Applications</div><div className="card"><h3>{apps.filter(a => a.status !== 'Draft').length}</h3>Submitted</div><div className="card"><h3>{apps.filter(a => a.status === 'Admitted').length}</h3>Admitted</div></div>
    <div className="card">{draft ? <React.Fragment><h3>You have an application in progress</h3><p>{draft.app_no} · {draft.program_code || 'Program not chosen'}</p><button className="btn" onClick={() => openApp('form', draft.id)}>Continue Application →</button></React.Fragment>
      : <React.Fragment><h3>Start a new application</h3><p>Browse programs and apply for the 2026 B.Tech intake.</p><button className="btn" onClick={() => go('programs')}>Browse Programs →</button></React.Fragment>}</div></div>);
}
function MyApps({ go, openApp }) {
  const [apps, setApps] = useState([]); useEffect(() => { API('/applications/mine').then(setApps); }, []);
  return (<div><h1>My Applications</h1><div className="card tw" style={{ marginTop: 14 }}><table><thead><tr><th>Application No.</th><th>Program</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody>
    {apps.map(a => <tr key={a.id}><td>{a.app_no}</td><td>{a.program_code || '-'}</td><td><span className={'tag ' + a.payment_status}>{a.payment_status}</span></td><td><span className={'tag ' + a.status}>{a.status}</span></td>
      <td><button className="btn sm" onClick={() => openApp(a.status === 'Draft' ? 'form' : 'confirm', a.id)}>{a.status === 'Draft' ? 'Continue' : 'View'}</button></td></tr>)}
    {!apps.length && <tr><td colSpan="5">No applications yet. Go to Courses / Programs to apply.</td></tr>}</tbody></table></div></div>);
}
function Notifs({ refresh }) {
  const [n, setN] = useState([]); useEffect(() => { API('/notifications').then(x => { setN(x); API('/notifications/read', 'POST').then(refresh); }); }, []);
  return (<div><h1>Notifications</h1>{n.map(x => <div key={x.id} className="card" style={{ marginTop: 12 }}>🔔 {x.message}<br /><small style={{ color: 'var(--mu)' }}>{fdate(x.created_at)}</small></div>)}{!n.length && <p className="sub">No notifications.</p>}</div>);
}
function Profile({ user }) { return (<div><h1>Profile</h1><div className="card" style={{ marginTop: 14 }}><div className="kv"><span>Name</span><span>{user.name}</span><span>Email</span><span>{user.email}</span><span>Phone</span><span>{user.phone || '-'}</span><span>Role</span><span>{user.role}</span></div></div></div>); }

function Admin() {
  const [rows, setRows] = useState([]), [err, setErr] = useState('');
  const load = () => API('/admin/applications').then(setRows).catch(e => setErr(e.message)); useEffect(() => { load(); }, []);
  const run = async () => { await API('/admin/allocate', 'POST'); load(); };
  const set = async (id, status) => { await API('/admin/applications/' + id, 'PATCH', { status }); load(); };
  const c = s => rows.filter(r => r.status === s).length;
  return (<div><h1>Admin Dashboard</h1><p className="sub">Submitted applications ranked by merit (40% Class 10 + 60% Class 12) within each program.</p>
    <div className="grid g3"><div className="card"><h3>{rows.length}</h3>Submitted</div><div className="card"><h3>{c('Admitted')}</h3>Admitted</div><div className="card"><h3>{c('Waitlisted')}</h3>Waitlisted</div></div>
    <button className="btn" onClick={run}>Run merit allocation</button> <span className="sub">Seats per program = intake; others waitlisted.</span>
    {err && <div className="alert al-e">{err}</div>}
    <div className="card tw" style={{ marginTop: 14 }}><table><thead><tr><th>Application No.</th><th>Name</th><th>Program</th><th>10th</th><th>12th</th><th>Merit</th><th>Payment</th><th>Status</th><th>Set</th></tr></thead><tbody>
      {rows.map(r => <tr key={r.id}><td>{r.app_no}</td><td>{r.full_name}</td><td>{r.program_code}</td><td>{r.marks10}</td><td>{r.marks12}</td><td><b>{r.merit}</b></td><td><span className={'tag ' + r.payment_status}>{r.payment_status}</span></td><td><span className={'tag ' + r.status}>{r.status}</span></td>
        <td><select value={r.status} onChange={e => set(r.id, e.target.value)}>{['Submitted', 'Admitted', 'Waitlisted', 'Rejected'].map(s => <option key={s}>{s}</option>)}</select></td></tr>)}
      {!rows.length && <tr><td colSpan="9">No submitted applications yet.</td></tr>}</tbody></table></div></div>);
}

function App() {
  const [user, setUser] = useState(null), [ready, setReady] = useState(false), [view, setView] = useState('login'), [appId, setAppId] = useState(null), [preset, setPreset] = useState(''), [unread, setUnread] = useState(0);
  const home = u => (u.role === 'admin' ? 'admin' : 'dashboard');
  useEffect(() => { if (!localStorage.getItem('tok')) return setReady(true); API('/me').then(u => { setUser(u); setView(home(u)); }).catch(() => localStorage.removeItem('tok')).finally(() => setReady(true)); }, []);
  const refresh = () => API('/notifications').then(n => setUnread(n.filter(x => !x.is_read).length)).catch(() => {});
  useEffect(() => { if (user && user.role === 'applicant') refresh(); }, [user, view]);
  const go = (v, id) => { if (id !== undefined) setAppId(id); setView(v); window.scrollTo(0, 0); };
  const logout = () => { localStorage.removeItem('tok'); setUser(null); setView('login'); };
  const start = code => { setPreset(code); setAppId(null); go('form'); };
  const openApp = (v, id) => go(v, id);
  const openLatest = async v => { const a = (await API('/applications/mine')).find(x => x.status === 'Draft'); a ? go(v, a.id) : go('programs'); };
  if (!ready) return <div className="center">Loading…</div>;
  if (!user) return view === 'register' ? <Register go={go} /> : <Login go={go} onLogin={u => { setUser(u); setView(home(u)); }} />;
  const items = user.role === 'admin' ? [['admin', '🏠', 'Dashboard']] : [['dashboard', '🏠', 'Dashboard'], ['programs', '🏛', 'Courses / Programs'], ['form', '📝', 'New Application'], ['myapps', '📄', 'My Applications'], ['docs', '⬆', 'Upload Documents'], ['payment', '💳', 'Payments'], ['notifs', '🔔', 'Notifications'], ['profile', '👤', 'Profile']];
  const click = k => { if (k === 'form') { setPreset(''); setAppId(null); go('form'); } else if (k === 'docs' || k === 'payment') openLatest(k); else go(k); };
  const need = (v) => appId ? null : 'Open an application first.';
  let page;
  if (view === 'dashboard') page = <Dashboard go={go} user={user} openApp={openApp} />;
  else if (view === 'programs') page = <Programs go={go} start={start} />;
  else if (view === 'form') page = <Form key={appId || 'new' + preset} go={go} appId={appId} user={user} setAppId={setAppId} preset={preset} />;
  else if (view === 'docs' && appId) page = <Docs go={go} appId={appId} />;
  else if (view === 'payment' && appId) page = <Payment go={go} appId={appId} />;
  else if (view === 'confirm' && appId) page = <Confirm go={go} appId={appId} />;
  else if (view === 'myapps') page = <MyApps go={go} openApp={openApp} />;
  else if (view === 'notifs') page = <Notifs refresh={refresh} />;
  else if (view === 'profile') page = <Profile user={user} />;
  else if (view === 'admin') page = <Admin />;
  else page = <div className="center">Nothing here yet. Use the menu.</div>;
  return (<div><Header user={user} go={go} unread={unread} logout={logout} />
    <div className="layout"><div className="side">{items.map(([k, i, l]) => <a key={k} className={view === k ? 'on' : ''} onClick={() => click(k)}>{i} {l}</a>)}<a onClick={logout}>↪ Logout</a>
      <div className="help"><h4>Need Help?</h4>For any admission related queries, contact our admission cell.<br />📞 033 2666 1234<br />✉ admission@iemcal.com<br />🕑 Mon - Sat (10 AM - 5 PM)</div></div>
      <div className="main">{page}</div></div><Footer /></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
